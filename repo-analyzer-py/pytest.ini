[pytest]
minversion = 8.0
testpaths = tests
norecursedirs = tests/fixtures .*
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=repo_analyzer
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    -m "not network"
# asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning
markers =
    unit: unit tests (fast, isolated)
    integration: integration tests (cross-module)
    e2e: end-to-end tests (full pipeline)
    slow: slow tests (skipped by default in CI fast lane)
    network: tests that require network access (skipped by default)
