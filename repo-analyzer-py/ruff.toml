line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "build", "dist"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "FA",   # flake8-future-annotations
    "ICN",  # flake8-import-conventions
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "TID",  # flake8-tidy-imports
]
ignore = [
    "S101",   # use of assert (needed in tests)
    "S603",   # subprocess call - checked usage
    "S607",   # partial executable path
    "S104",   # binding to all interfaces (API server intentional)
    "S105",   # possible hardcoded password (false positive on test keys)
    "S110",   # try-except-pass (intentional defensive cleanup)
    "DTZ005", # datetime.now() without tz (API uses local time for display)
    "EM101",  # exception with string literal
    "EM102",  # exception with f-string literal (readability preference)
    "COM812", # trailing comma missing (conflicts with formatter)
    "RET504", # unnecessary variable before return
    "UP042",  # str+Enum -> StrEnum (kept for Pydantic v1 compat & explicitness)
    "UP046",  # Generic class type parameters (intentional Generic subclass)
    "TC001",  # move application import into type-checking block
    "TC002",  # move third-party import into type-checking block
    "TC003",  # move standard-library import into type-checking block
    "SIM102", # nested if (kept for readability with comments)
    "SIM103", # return condition directly (explicit branches clearer)
    "SIM105", # use contextlib.suppress (less readable for defensive cleanup)
    "RUF001", # ambiguous unicode char (intentional icon glyphs)
    "RUF002", # ambiguous unicode in docstrings (intentional math symbols)
    "RUF005", # list concatenation (readable as-is)
    "RUF022", # __all__ sorting (manual order preferred for readability)
    "RUF046", # int() already integer (intentional clamping for clarity)
    "N818",   # exception suffix Exception vs Error (SDD mandates *Exception)
    "A002",   # builtin shadowing (format/id are accepted API names)
    "B007",   # unused loop var (os.walk convention)
    "B008",   # typer.Option in defaults (Typer idiom)
]

[lint.per-file-ignores]
"tests/**" = ["S", "SLF", "PT", "E501", "N802", "SIM117"]
"tests/**/__init__.py" = ["F401"]
"src/repo_analyzer/review/**" = ["E501"]
"src/repo_analyzer/adapters/llm/**" = ["E501"]

[lint.isort]
known-first-party = ["repo_analyzer"]
force-single-line = false

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
