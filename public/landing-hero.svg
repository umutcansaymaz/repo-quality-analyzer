<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="repository analysis illustration">
  <rect width="600" height="400" fill="#F2EEE3"/>
  <!-- Grafik düğümleri (repo ağı) -->
  <g fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2.5">
    <rect x="60" y="60" width="90" height="60" rx="10"/>
    <rect x="230" y="40" width="90" height="60" rx="10"/>
    <rect x="400" y="90" width="90" height="60" rx="10"/>
    <rect x="150" y="220" width="90" height="60" rx="10"/>
    <rect x="360" y="240" width="90" height="60" rx="10"/>
  </g>
  <!-- Kenarlar -->
  <g stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round">
    <line x1="150" y1="90" x2="230" y2="70"/>
    <line x1="320" y1="70" x2="400" y2="110"/>
    <line x1="105" y1="120" x2="195" y2="220"/>
    <line x1="270" y1="100" x2="240" y2="220"/>
    <line x1="445" y1="150" x2="405" y2="240"/>
    <line x1="240" y1="250" x2="360" y2="260"/>
  </g>
  <!-- Kil vurgular: analiz çizgisi + skor damgası -->
  <polyline points="70,320 180,300 290,312 400,270 520,290" fill="none" stroke="#C5532F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="520" cy="290" r="9" fill="#C5532F"/>
  <circle cx="520" cy="290" r="3.5" fill="#F2EEE3"/>
  <!-- Skor damgası (A) -->
  <circle cx="520" cy="150" r="42" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <circle cx="520" cy="150" r="34" fill="#E8E2D2" stroke="#C5532F" stroke-width="1.6"/>
  <text x="520" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#0A0A0A">A</text>
</svg>