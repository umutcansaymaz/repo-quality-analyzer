<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="architecture — browser and server">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C5532F"/>
    </marker>
  </defs>

  <!-- Browser katmanı (açık) -->
  <rect x="30" y="30" width="740" height="230" rx="14" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2"/>
  <!-- Pencere ikonu (katman etiketi) -->
  <rect x="55" y="50" width="34" height="26" rx="4" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="2"/>
  <circle cx="63" cy="59" r="1.8" fill="#C5532F"/>
  <circle cx="71" cy="59" r="1.8" fill="#0A0A0A"/>
  <circle cx="79" cy="59" r="1.8" fill="#0A0A0A"/>

  <!-- Browser kutuları (ikonografik) -->
  <g>
    <!-- analyzeLocalFiles: sayfa -->
    <rect x="55" y="100" width="200" height="90" rx="10" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="90" y="122" width="22" height="34" rx="3" fill="none" stroke="#0A0A0A" stroke-width="2"/>
    <line x1="122" y1="130" x2="168" y2="130" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <line x1="122" y1="138" x2="152" y2="138" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <line x1="122" y1="146" x2="160" y2="146" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

    <!-- buildLocalReport: damga -->
    <rect x="300" y="100" width="200" height="90" rx="10" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="2"/>
    <circle cx="400" cy="145" r="24" fill="none" stroke="#0A0A0A" stroke-width="2.5"/>
    <text x="400" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#0A0A0A">A</text>

    <!-- explainWithLLM: yıldız -->
    <rect x="545" y="100" width="200" height="90" rx="10" fill="#F2EEE3" stroke="#C5532F" stroke-width="2"/>
    <polygon points="645,118 652,134 670,136 657,148 660,166 645,158 630,166 633,148 620,136 638,134" fill="#C5532F"/>
  </g>
  <line x1="255" y1="145" x2="300" y2="145" stroke="#C5532F" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="145" x2="545" y2="145" stroke="#C5532F" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Browser → server oku -->
  <line x1="400" y1="260" x2="400" y2="300" stroke="#C5532F" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Server katmanı (koyu) -->
  <rect x="30" y="300" width="740" height="170" rx="14" fill="#0A0A0A"/>
  <!-- Sunucu raf ikonu (katman etiketi) -->
  <rect x="55" y="318" width="34" height="26" rx="4" fill="#1A1815" stroke="#D9785C" stroke-width="2"/>
  <line x1="60" y1="328" x2="84" y2="328" stroke="#D9785C" stroke-width="1.6"/>
  <circle cx="61" cy="337" r="1.6" fill="#D9785C"/>

  <g>
    <!-- API: ok -->
    <rect x="55" y="360" width="210" height="80" rx="10" fill="#1A1815" stroke="#D9785C" stroke-width="1.8"/>
    <circle cx="110" cy="400" r="16" fill="none" stroke="#F2EEE3" stroke-width="2.5"/>
    <polyline points="96,400 104,400 104,392 112,400 104,408 104,400" fill="#D9785C" stroke="none"/>

    <!-- Sonuç: göz -->
    <rect x="300" y="360" width="200" height="80" rx="10" fill="#1A1815" stroke="#D9785C" stroke-width="1.8"/>
    <path d="M360,386 a30,14 0 1 0 0.1,0 z" fill="none" stroke="#F2EEE3" stroke-width="2.5"/>
    <circle cx="360" cy="394" r="6" fill="#D9785C"/>

    <!-- DB: silindir -->
    <rect x="535" y="360" width="210" height="80" rx="10" fill="#1A1815" stroke="#7A8B6F" stroke-width="1.8"/>
    <ellipse cx="640" cy="382" rx="26" ry="9" fill="none" stroke="#F2EEE3" stroke-width="2.5"/>
    <line x1="614" y1="382" x2="614" y2="414" stroke="#F2EEE3" stroke-width="2.5"/>
    <line x1="666" y1="382" x2="666" y2="414" stroke="#F2EEE3" stroke-width="2.5"/>
    <path d="M614,398 a26,9 0 0 0 52,0" fill="none" stroke="#7A8B6F" stroke-width="2.5"/>
  </g>
  <line x1="265" y1="400" x2="300" y2="400" stroke="#D9785C" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="400" x2="535" y2="400" stroke="#7A8B6F" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
