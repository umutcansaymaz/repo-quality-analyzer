<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="architecture diagram — browser and server">
  <!-- Mimari akış diyagramı (README) -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C5532F"/>
    </marker>
  </defs>

  <!-- Browser katmanı (açık) -->
  <rect x="30" y="30" width="740" height="230" rx="14" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2"/>
  <text x="55" y="62" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#0A0A0A">BROWSER (page.tsx)</text>

  <!-- Browser kutuları -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#0A0A0A">
    <rect x="55" y="85" width="200" height="60" rx="8" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="1.8"/>
    <text x="155" y="112" text-anchor="middle">analyzeLocalFiles()</text>
    <text x="155" y="132" text-anchor="middle" font-size="12" opacity="0.6">files → evidence</text>

    <rect x="300" y="85" width="200" height="60" rx="8" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="1.8"/>
    <text x="400" y="112" text-anchor="middle">buildLocalReport()</text>
    <text x="400" y="132" text-anchor="middle" font-size="12" opacity="0.6">score + root causes</text>

    <rect x="545" y="85" width="200" height="60" rx="8" fill="#F2EEE3" stroke="#C5532F" stroke-width="1.8"/>
    <text x="645" y="112" text-anchor="middle">explainWithLLM()</text>
    <text x="645" y="132" text-anchor="middle" font-size="12" opacity="0.6">BYOK → provider</text>
  </g>
  <line x1="255" y1="115" x2="300" y2="115" stroke="#C5532F" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="115" x2="545" y2="115" stroke="#C5532F" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Browser → server oku -->
  <line x1="400" y1="260" x2="400" y2="300" stroke="#C5532F" stroke-width="3" marker-end="url(#arr)"/>
  <text x="415" y="287" font-family="'Courier New', monospace" font-size="13" fill="#C5532F">POST /api/analyze-local (report only)</text>

  <!-- Server katmanı (koyu) -->
  <rect x="30" y="300" width="740" height="170" rx="14" fill="#0A0A0A"/>
  <text x="55" y="330" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#F2EEE3">SERVER</text>
  <g font-family="'Courier New', monospace" font-size="14" fill="#F2EEE3">
    <rect x="55" y="350" width="210" height="55" rx="8" fill="#1A1815" stroke="#D9785C" stroke-width="1.6"/>
    <text x="160" y="377" text-anchor="middle">/api/analyze</text>
    <text x="160" y="394" text-anchor="middle" font-size="11" opacity="0.65">clone + scan + SSRF</text>

    <rect x="300" y="350" width="200" height="55" rx="8" fill="#1A1815" stroke="#D9785C" stroke-width="1.6"/>
    <text x="400" y="377" text-anchor="middle">/api/result/:id</text>
    <text x="400" y="394" text-anchor="middle" font-size="11" opacity="0.65">persisted report</text>

    <rect x="535" y="350" width="210" height="55" rx="8" fill="#1A1815" stroke="#7A8B6F" stroke-width="1.6"/>
    <text x="640" y="377" text-anchor="middle">db/analysis-results/</text>
    <text x="640" y="394" text-anchor="middle" font-size="11" opacity="0.65">JSON reports</text>
  </g>
  <line x1="265" y1="377" x2="300" y2="377" stroke="#D9785C" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="500" y1="377" x2="535" y2="377" stroke="#7A8B6F" stroke-width="2.5" marker-end="url(#arr)"/>
</svg>
