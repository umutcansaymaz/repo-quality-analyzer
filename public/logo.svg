<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="repo-quality-analyzer logo">
  <!-- Pergament & Ink marka logosu: yükselen analiz çizgisi + kil düğüm -->
  <rect x="2" y="2" width="44" height="44" rx="9" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="1.6"/>
  <!-- Mürekkep çizgi grafiği (repo → analiz → skor) -->
  <polyline points="9,35 16,28 24,31 31,20 39,13" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Kil vurgu segmenti (aksiyon) -->
  <line x1="24" y1="31" x2="31" y2="20" stroke="#C5532F" stroke-width="3" stroke-linecap="round"/>
  <!-- Kil düğüm (skor noktası) -->
  <circle cx="39" cy="13" r="4" fill="#C5532F"/>
  <circle cx="39" cy="13" r="1.5" fill="#F2EEE3"/>
  <!-- Kök düğüm (repo) -->
  <circle cx="9" cy="35" r="2.6" fill="#0A0A0A"/>
</svg>
