<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="repo-quality-analyzer — open graph card">
  <!-- Sosyal paylaşım kartı (GitHub/link önizleme) -->
  <rect width="1200" height="630" fill="#F2EEE3"/>

  <!-- Üst koyu bant: marka -->
  <rect width="1200" height="210" fill="#0A0A0A"/>
  <rect x="60" y="60" width="90" height="90" rx="18" fill="#F2EEE3" stroke="#C5532F" stroke-width="3"/>
  <polyline points="75,118 88,98 100,106 112,84 127,74" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="127" cy="74" r="7" fill="#C5532F"/>
  <text x="180" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#F2EEE3">repo-quality-analyzer</text>
  <text x="180" y="140" font-family="'Courier New', monospace" font-size="21" fill="#D9785C">privacy-first · deterministic · multi-language</text>

  <!-- Orta alan: repo → analiz → skor akışı -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#0A0A0A">
    <!-- Repo düğümü -->
    <rect x="90" y="330" width="190" height="70" rx="10" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2.5"/>
    <text x="185" y="372" text-anchor="middle">Repository</text>
    <!-- Analiz düğümü -->
    <rect x="455" y="330" width="290" height="70" rx="10" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2.5"/>
    <text x="600" y="372" text-anchor="middle">Browser Analysis</text>
    <!-- Skor düğümü -->
    <circle cx="975" cy="365" r="52" fill="#0A0A0A"/>
    <text x="975" y="378" text-anchor="middle" font-size="46" font-weight="bold" fill="#F2EEE3">A–F</text>
  </g>
  <!-- Kenarlar (kil) -->
  <line x1="280" y1="365" x2="455" y2="365" stroke="#C5532F" stroke-width="4" stroke-linecap="round"/>
  <line x1="745" y1="365" x2="923" y2="365" stroke="#C5532F" stroke-width="4" stroke-linecap="round"/>
  <polygon points="923,358 940,365 923,372" fill="#C5532F"/>
  <polygon points="455,358 438,365 455,372" fill="#C5532F"/>

  <!-- Güven satırı (alt) -->
  <rect x="300" y="500" width="600" height="64" rx="32" fill="#7A8B6F"/>
  <text x="600" y="540" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#F2EEE3">417 repos audited · 0 FP · 0 FN</text>
</svg>
