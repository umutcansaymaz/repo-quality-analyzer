<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="repo-quality-analyzer open graph card">
  <rect width="1200" height="630" fill="#F2EEE3"/>

  <!-- Üst koyu bant: marka -->
  <rect width="1200" height="210" fill="#0A0A0A"/>
  <rect x="60" y="60" width="90" height="90" rx="18" fill="#F2EEE3" stroke="#C5532F" stroke-width="3"/>
  <polyline points="75,118 88,98 100,106 112,84 127,74" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="127" cy="74" r="7" fill="#C5532F"/>
  <text x="180" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#F2EEE3">repo-quality-analyzer</text>

  <!-- Orta alan: repo → analiz → skor (ikonografik düğümler) -->
  <g>
    <!-- Repo: belge -->
    <rect x="90" y="330" width="190" height="70" rx="10" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2.5"/>
    <rect x="140" y="345" width="26" height="40" rx="4" fill="none" stroke="#0A0A0A" stroke-width="2.5"/>
    <line x1="178" y1="354" x2="218" y2="354" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="178" y1="364" x2="208" y2="364" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <line x1="178" y1="374" x2="214" y2="374" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Analiz: dişli -->
    <rect x="455" y="330" width="290" height="70" rx="10" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2.5"/>
    <circle cx="600" cy="365" r="16" fill="none" stroke="#0A0A0A" stroke-width="3"/>
    <circle cx="600" cy="365" r="6" fill="#0A0A0A"/>
    <line x1="600" y1="340" x2="600" y2="349" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>
    <line x1="600" y1="381" x2="600" y2="390" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>
    <line x1="575" y1="365" x2="584" y2="365" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>
    <line x1="616" y1="365" x2="625" y2="365" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>

    <!-- Skor: damga -->
    <circle cx="975" cy="365" r="52" fill="#0A0A0A"/>
    <circle cx="975" cy="365" r="40" fill="none" stroke="#D9785C" stroke-width="2"/>
    <text x="975" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="50" font-weight="bold" fill="#F2EEE3">A</text>
  </g>
  <!-- Kenarlar -->
  <line x1="280" y1="365" x2="455" y2="365" stroke="#C5532F" stroke-width="4" stroke-linecap="round"/>
  <line x1="745" y1="365" x2="923" y2="365" stroke="#C5532F" stroke-width="4" stroke-linecap="round"/>
  <polygon points="923,358 940,365 923,372" fill="#C5532F"/>
  <polygon points="455,358 438,365 455,372" fill="#C5532F"/>

  <!-- Güven rozeti: sayı + ikon (evrensel, geniş aralıklı) -->
  <rect x="300" y="500" width="600" height="64" rx="32" fill="#7A8B6F"/>
  <text x="380" y="540" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#F2EEE3">417</text>
  <rect x="448" y="520" width="18" height="26" rx="4" fill="none" stroke="#F2EEE3" stroke-width="2.2"/>
  <line x1="476" y1="528" x2="506" y2="528" stroke="#F2EEE3" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="476" y1="535" x2="498" y2="535" stroke="#F2EEE3" stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>
  <text x="556" y="540" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#F2EEE3">0</text>
  <line x1="588" y1="522" x2="608" y2="542" stroke="#F2EEE3" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="608" y1="522" x2="588" y2="542" stroke="#F2EEE3" stroke-width="4.5" stroke-linecap="round"/>
  <text x="668" y="540" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#F2EEE3">0</text>
  <circle cx="702" cy="532" r="12" fill="#F2EEE3"/>
  <polyline points="696,532 701,537 709,528" fill="none" stroke="#7A8B6F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
