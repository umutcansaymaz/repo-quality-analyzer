<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" role="img" aria-label="no data illustration">
  <!-- Boş durum: boş pergament + kesik grafik (analiz/veri yok) -->
  <rect x="45" y="20" width="110" height="90" rx="8" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="2"/>
  <!-- Sayfa içi boş satırlar -->
  <line x1="60" y1="42" x2="140" y2="42" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="60" y1="54" x2="120" y2="54" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="60" y1="66" x2="132" y2="66" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Kesik grafik (veri akışı yok) -->
  <polyline points="60,92 76,84 92,90 108,78" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="108" y1="78" x2="124" y2="84" stroke="#C5532F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,5"/>
  <circle cx="124" cy="84" r="3" fill="#C5532F"/>
</svg>
