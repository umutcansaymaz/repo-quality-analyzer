    <line x1="348" y1="34" x2="328" y2="54" stroke="#A03A2A" stroke-width="4" stroke-linecap="round"/>

    <!-- 0 FN (onay) -->
    <rect x="400" y="22" width="120" height="46" rx="10" fill="#E8E2D2" stroke="#0A0A0A" stroke-width="1.8"/>
    <text x="432" y="52" font-size="22" text-anchor="middle">0</text>
